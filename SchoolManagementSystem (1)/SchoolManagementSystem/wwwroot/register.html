<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration - School Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Registration Form</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Student Id:</label>
                <input type="text" id="studentId" readonly>
            </div>
            <div class="form-group">
                <label>First Name *:</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label>Last Name:</label>
                <input type="text" id="lastName">
            </div>
            <div class="form-group">
                <label>Age *:</label>
                <input type="number" id="age" required>
            </div>
            <div class="form-group">
                <label>DOB *:</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label>Gender *:</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Email Id *:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Phone Number *:</label>
                <input type="text" id="phone" required>
            </div>

            <h3>Login Credentials</h3>
            <div class="form-group">
                <label>Username *:</label>
                <input type="text" id="regUsername" required>
            </div>
            <div class="form-group">
                <label>Password *:</label>
                <input type="password" id="regPassword" required>
            </div>

            <h3>Qualification Details</h3>
            <table id="qualTable">
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>University</th>
                        <th>Year</th>
                        <th>Percentage</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="text" class="course" required></td>
                        <td><input type="text" class="university" required></td>
                        <td><input type="number" class="year" required></td>
                        <td><input type="number" step="0.01" class="percentage" required></td>
                        <td><button type="button" class="removeBtn" onclick="removeRow(this)">Remove</button></td>
                    </tr>
                </tbody>
            </table>
            <button type="button" onclick="addRow()">Add Qualification</button>
            <br><br>
            <button type="submit">Register</button>
        </form>
        <p>Already registered? <a href="index.html">Login here</a></p>
    </div>
    <script>
        window.onload = async function() {
            const res = await fetch('/api/students/next-id');
            const data = await res.json();
            document.getElementById('studentId').value = data.studentId;
        };

        function addRow() {
            const tbody = document.querySelector('#qualTable tbody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="text" class="course" required></td>
                <td><input type="text" class="university" required></td>
                <td><input type="number" class="year" required></td>
                <td><input type="number" step="0.01" class="percentage" required></td>
                <td><button type="button" class="removeBtn" onclick="removeRow(this)">Remove</button></td>
            `;
            tbody.appendChild(row);
        }

        function removeRow(btn) {
            const tbody = document.querySelector('#qualTable tbody');
            if (tbody.rows.length > 1) {
                btn.closest('tr').remove();
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const qualifications = [];
            const rows = document.querySelectorAll('#qualTable tbody tr');
            rows.forEach(row => {
                qualifications.push({
                    course: row.querySelector('.course').value,
                    university: row.querySelector('.university').value,
                    year: parseInt(row.querySelector('.year').value),
                    percentage: parseFloat(row.querySelector('.percentage').value)
                });
            });

            const student = {
                studentId: document.getElementById('studentId').value,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                age: parseInt(document.getElementById('age').value),
                dob: document.getElementById('dob').value,
                gender: document.getElementById('gender').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                username: document.getElementById('regUsername').value,
                password: document.getElementById('regPassword').value,
                qualifications: qualifications
            };

            const response = await fetch('/api/students/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            });

            if (response.ok) {
                alert('Registration successful!');
                window.location.href = 'index.html';
            } else {
                alert('Registration failed');
            }
        });
    </script>
</body>
</html>
